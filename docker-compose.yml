# Local stack: API, webhook worker and Postgres.
# The API is published on 127.0.0.1 only.
services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://ticketdesk:ticketdesk@db:5432/ticketdesk
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
    depends_on: [db]

  worker:
    build: .
    command: ["python", "-m", "ticketdesk.workers.dispatcher"]
    environment:
      DATABASE_URL: postgresql+psycopg://ticketdesk:ticketdesk@db:5432/ticketdesk
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
    depends_on: [db]

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ticketdesk
      POSTGRES_PASSWORD: ticketdesk
      POSTGRES_DB: ticketdesk
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
